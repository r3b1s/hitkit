[project]
name = "hitkit"
version = "0.1.0"
description = "Opinionated self-hosted dev infrastructure as libvirt VMs on your own workstation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "cryptography>=42",
    "libvirt-python>=10.0",
]

[project.scripts]
hitkit = "hitkit.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

# The agent skills live in skills/ at the repository root (so `npx skills` finds them);
# the wheel bundles them as hitkit/skills.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "hitkit/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
