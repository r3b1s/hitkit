# Dogfooding on debian: a host of that distribution for developing and testing
# hitkit there, including running a nested hitkit (subnet 10.78.0.0/24).
name = "hitkit-dev-debian"
description = "debian VM for developing and testing hitkit on debian (nested virtualization)"
version = 1
hooks_from = "hitkit-dev"

[[machine]]
name = "dev-debian"
role = "hitkit-dev-debian"
cpus = 4
memory_mib = 8192
data_disk_gib = 80
