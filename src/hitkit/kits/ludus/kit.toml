# Ludus (https://ludus.cloud): cyber ranges on Proxmox VE, built on hitkit's Proxmox
# image and installed on first boot (design §13.14). Its OS disk holds Ludus's users,
# ranges and WireGuard keys, so it is stateful: updated in place, never re-imaged.
name = "ludus"
description = "Ludus 2.3.8 cyber-range server on Proxmox VE 9 (API https://ludus.hitkit.internal:8080)"
version = 1

[[machine]]
name = "ludus"
role = "ludus"
cpus = 8
memory_mib = 32768
data_disk_gib = 250
stateful_os = true
ready_timeout = 3600
