# runner-arch: an Arch Linux job VM for the forge's ephemeral pool (`runs-on: arch`).
# Each job gets a fresh VM and runs directly on it (forgejo-runner host mode) as the
# `runner` user, with passwordless sudo, pacman and Docker. Extra packages come from
# ~/.config/hitkit/images/runner-arch.toml (design §13.15).
[Distribution]
Distribution=arch

[Output]
RepartDirectories=../common/mkosi.repart
Format=disk
ImageId=hitkit-runner-arch
ManifestFormat=json

[Content]
ExtraTrees=../common/mkosi.extra
ExtraTrees=../arch-common/mkosi.extra
Bootable=yes
Bootloader=systemd-boot
Locale=C.UTF-8
Timezone=UTC
Keymap=us
KernelCommandLine=console=tty0 console=ttyS0,115200 rw
RemoveFiles=/etc/ssh/ssh_host_*
Packages=
        base
        linux
        systemd
        openssh
        qemu-guest-agent
        sudo
        e2fsprogs
        ca-certificates
        base-devel
        git
        git-lfs
        nodejs
        npm
        python
        docker
        docker-buildx
        curl
        wget
        jq
        unzip
        zip
        zstd
        rsync
        openssl
        which
        less
