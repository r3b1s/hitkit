# pbs: Proxmox Backup Server 4 installed on Debian 13 (the documented "install on
# Debian" route, https://pbs.proxmox.com/docs/installation.html), on top of the base
# image: Debian's own kernel and hitkit's systemd-networkd stay, as the docs describe.
[Include]
Include=../base

[Content]
Packages=
        proxmox-archive-keyring=4.0
        proxmox-backup-server=4.2.8-1
        apt
        postfix
        curl
