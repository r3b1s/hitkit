# proxmox: Proxmox VE 9 installed on Debian 13 (the documented "install on
# Debian" route), with the Proxmox kernel and ifupdown2 networking. Standalone
# rather than Include=../base: kernel and network stack differ.
[Distribution]
Distribution=debian
Release=trixie

[Output]
RepartDirectories=../common/mkosi.repart
Format=disk
ImageId=hitkit-proxmox
ManifestFormat=json

[Content]
ExtraTrees=../common/mkosi.extra
Bootable=yes
Bootloader=systemd-boot
Locale=C.UTF-8
Timezone=UTC
Keymap=us
KernelCommandLine=console=tty0 console=ttyS0,115200 rw
RemoveFiles=/etc/ssh/ssh_host_*
Packages=
        proxmox-default-kernel
        proxmox-ve
        postfix
        open-iscsi
        systemd-timesyncd
        ifupdown2
        systemd-boot
        systemd-boot-efi
        udev
        dbus
        kmod
        e2fsprogs
        iproute2
        openssh-server
        qemu-guest-agent
        ca-certificates
        curl
