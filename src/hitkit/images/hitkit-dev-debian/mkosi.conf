# hitkit-dev-debian: a Debian 13 host for developing and testing hitkit on
# Debian (Debian's own libvirt, mkosi and Python packages). Ships a strict
# custom nftables ruleset on purpose, to exercise hitkit's nftables support.
[Include]
Include=../base

[Content]
ExtraTrees=../dev-common/mkosi.extra
Packages=
        libvirt-daemon-system
        qemu-system-x86
        qemu-utils
        ovmf
        dnsmasq-base
        mkosi
        systemd-ukify
        systemd-repart
        python3-libvirt
        python3-click
        python3-cryptography
        python3-pytest
        python3-venv
        git
        sudo
        nftables
        dosfstools
        mtools
        curl
