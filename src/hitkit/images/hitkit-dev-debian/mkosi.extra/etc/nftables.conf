#!/usr/sbin/nft -f
# A deliberately strict custom ruleset (test fixture): input and forward drop
# by default. `hitkit setup` must open hitkit0 through it.
flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		iif lo accept
		tcp dport 22 accept
		meta l4proto icmp accept
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
