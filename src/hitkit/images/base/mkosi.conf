# hitkit-base: the Debian 13 image every hitkit machine boots from (design §8.1).
[Distribution]
Distribution=debian
Release=trixie

[Output]
RepartDirectories=../common/mkosi.repart
Format=disk
ImageId=hitkit-base
ManifestFormat=json

[Content]
# Guest pieces shared by every image (provision/readiness units, partition layout).
ExtraTrees=../common/mkosi.extra
Bootable=yes
Bootloader=systemd-boot
# Preset what systemd-firstboot would otherwise prompt for on the console.
Locale=C.UTF-8
Timezone=UTC
Keymap=us
KernelCommandLine=console=tty0 console=ttyS0,115200 rw
# Every machine gets its own SSH host key through a credential; never ship one.
RemoveFiles=/etc/ssh/ssh_host_*
Packages=
        linux-image-amd64
        systemd
        systemd-sysv
        systemd-boot
        systemd-boot-efi
        systemd-resolved
        systemd-timesyncd
        udev
        dbus
        kmod
        e2fsprogs
        iproute2
        openssh-server
        qemu-guest-agent
        ca-certificates
        zstd
