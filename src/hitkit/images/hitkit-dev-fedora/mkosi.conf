# hitkit-dev-fedora: a Fedora host for developing and testing hitkit on Fedora
# (firewalld, SELinux, Fedora's libvirt/mkosi). Standalone: different distro.
[Distribution]
Distribution=fedora
Release=44

[Output]
RepartDirectories=../common/mkosi.repart
Format=disk
ImageId=hitkit-dev-fedora
ManifestFormat=json

[Content]
ExtraTrees=../common/mkosi.extra
ExtraTrees=../dev-common/mkosi.extra
Bootable=yes
Bootloader=systemd-boot
Locale=C.UTF-8
Timezone=UTC
Keymap=us
# Built on non-Fedora hosts the image cannot be labeled at build time (no
# setfiles), so it relabels on first boot and runs SELinux permissive; check
# `ausearch -m avc` for denials hitkit would hit on an enforcing Fedora host.
KernelCommandLine=console=tty0 console=ttyS0,115200 rw enforcing=0
RemoveFiles=/etc/ssh/ssh_host_*
Packages=
        kernel
        systemd
        systemd-boot-unsigned
        systemd-networkd
        systemd-resolved
        systemd-ukify
        udev
        openssh-server
        qemu-guest-agent
        libvirt-daemon-kvm
        libvirt-daemon-config-network
        edk2-ovmf
        mkosi
        python3-libvirt
        python3-click
        python3-cryptography
        python3-pytest
        git
        firewalld
        sudo
        e2fsprogs
        dosfstools
        mtools
        iproute
        curl
        ca-certificates
        shadow-utils
        tar
        fedora-gpg-keys
        distribution-gpg-keys
        rpm
        dnf5
        apt
        debian-keyring
        selinux-policy-targeted
