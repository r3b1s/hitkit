# hitkit-dev: an Arch Linux machine for developing hitkit inside hitkit.
# It runs its own (nested) hitkit, so it carries the full host toolchain.
[Distribution]
Distribution=arch

[Output]
RepartDirectories=../common/mkosi.repart
Format=disk
ImageId=hitkit-dev
ManifestFormat=json

[Content]
ExtraTrees=../common/mkosi.extra
ExtraTrees=../arch-common/mkosi.extra
ExtraTrees=../dev-common/mkosi.extra
Bootable=yes
Bootloader=systemd-boot
Locale=C.UTF-8
Timezone=UTC
Keymap=us
KernelCommandLine=console=tty0 console=ttyS0,115200 rw
RemoveFiles=/etc/ssh/ssh_host_*
Packages=
        base
        linux
        systemd
        openssh
        qemu-guest-agent
        sudo
        git
        base-devel
        pkgconf
        python
        libvirt-python
        python-click
        python-cryptography
        python-pytest
        uv
        libvirt
        qemu-base
        dnsmasq
        nftables
        edk2-ovmf
        mkosi
        apt
        debian-archive-keyring
        systemd-ukify
        dosfstools
        mtools
        e2fsprogs
