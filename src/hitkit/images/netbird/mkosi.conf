# netbird: NetBird's self-hosted stack (combined management/signal/relay/STUN
# server and dashboard) behind Traefik, run with Docker Compose as upstream's
# quickstart does. Container images are pinned by digest in the compose file
# and pulled on first boot onto the data disk.
[Include]
Include=../base

[Content]
Packages=
        curl
        docker-ce=5:29.9.0-1~debian.13~trixie
        docker-ce-cli=5:29.9.0-1~debian.13~trixie
        containerd.io=2.4.1-2~debian.13~trixie
        docker-compose-plugin=5.6.0-1~debian.13~trixie
