name: OSV-Scanner

# A full scan on every change, not only the vulnerabilities a pull request adds:
# any known-vulnerable or malicious dependency in uv.lock blocks merging until it
# is fixed or recorded as not exploitable in osv-scanner.toml (SECURITY.md).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * *"

permissions: {}

jobs:
  scan:
    name: Dependency scan (OSV-Scanner)
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --lockfile=uv.lock
